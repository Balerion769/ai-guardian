app = "ai-guardian-api"
primary_region = "iad"

[build]
  dockerfile = "dashboard/Dockerfile.api"

[env]
  AIGUARDIAN_MODE = "hosted"
  PORT = "8000"

[processes]
  app = "python -m uvicorn main:app --host 0.0.0.0 --port 8000"
  worker = "sh -c 'rq worker audits --url \"$REDIS_URL\"'"

[deploy]
  release_command = "python -m alembic -c alembic.ini upgrade head"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
