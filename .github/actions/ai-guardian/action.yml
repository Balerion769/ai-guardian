name: AI Guardian
description: Local-first security audit; submitted code stays on the runner with the default API URL.
inputs:
  fail_on_high:
    description: Fail the job if a HIGH finding is reported.
    default: 'true'
    required: false
  api_url:
    description: Audit API endpoint; a non-local URL sends changed code to that endpoint.
    default: http://localhost:8000/api/v1/audit
    required: false
  use_static_only:
    description: Skip the audit API and run the local static scanner only.
    default: 'false'
    required: false
  model:
    description: Expected model name when the API is used.
    default: qwen2.5-coder
    required: false
runs:
  using: composite
  steps:
    - name: Install AI Guardian dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        GITHUB_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install -r "$GITHUB_ACTION_PATH/../../../requirements.txt" 'requests>=2.32,<3' > /dev/null
    - name: Audit changed files
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        GITHUB_ACTION_PATH: ${{ github.action_path }}
        AIGUARDIAN_FAIL_ON_HIGH: ${{ inputs.fail_on_high }}
        AIGUARDIAN_API_URL: ${{ inputs.api_url }}
        AIGUARDIAN_STATIC_ONLY: ${{ inputs.use_static_only }}
        AIGUARDIAN_MODEL: ${{ inputs.model }}
      run: |
        python "$GITHUB_ACTION_PATH/audit_pr.py" \
          --fail-on-high "$AIGUARDIAN_FAIL_ON_HIGH" \
          --api-url "$AIGUARDIAN_API_URL" \
          --use-static-only "$AIGUARDIAN_STATIC_ONLY" \
          --model "$AIGUARDIAN_MODEL"
branding:
  icon: shield
  color: red
