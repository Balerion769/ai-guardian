services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aiguardian
      POSTGRES_USER: aiguardian_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-local-admin-password-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiguardian_admin -d aiguardian"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  db-init:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    command: ["python", "-m", "dashboard.db.migrate"]
    environment:
      DATABASE_URL: postgresql+psycopg://aiguardian_admin:${POSTGRES_ADMIN_PASSWORD:-local-admin-password-change-me}@postgres:5432/aiguardian
      AIGUARDIAN_DB_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-local-app-password-change-me}
      APP_DATABASE_ROLE: aiguardian_app
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    environment: &hosted_env
      AIGUARDIAN_MODE: hosted
      DATABASE_URL: postgresql+psycopg://aiguardian_app:${POSTGRES_APP_PASSWORD:-local-app-password-change-me}@postgres:5432/aiguardian
      REDIS_URL: redis://redis:6379/0
      DASHBOARD_DEV_MODE: ${DASHBOARD_DEV_MODE:-1}
      DASHBOARD_SESSION_SECRET: ${DASHBOARD_SESSION_SECRET:-local-development-session-secret-change-me}
      DASHBOARD_TOKEN_ENCRYPTION_KEY: ${DASHBOARD_TOKEN_ENCRYPTION_KEY:-}
      DASHBOARD_PUBLIC_BASE_URL: ${DASHBOARD_PUBLIC_BASE_URL:-http://127.0.0.1:8001}
      DASHBOARD_WEB_BASE_URL: ${DASHBOARD_WEB_BASE_URL:-http://localhost:3000}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_TEAM: ${STRIPE_PRICE_TEAM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      BILLING_EMAIL_FROM: ${BILLING_EMAIL_FROM:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://127.0.0.1:8001/api/v1/auth/github/callback}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}
      GITHUB_APP_INSTALL_URL: ${GITHUB_APP_INSTALL_URL:-https://github.com/apps/ai-guardian/installations/new}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434/api/generate}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder}
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8001}:8000"
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    command: ["rq", "worker", "audits", "--url", "redis://redis:6379/0"]
    environment: *hosted_env
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  retention:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    command: ["python", "-m", "dashboard.billing.retention"]
    environment: *hosted_env
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
